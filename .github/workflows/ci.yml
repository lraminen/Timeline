name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache WordPress downloads (Playground)
        uses: actions/cache@v4
        with:
          path: ~/.wordpress-playground
          key: wordpress-playground-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Test
        # Includes the WordPress plugin's PHP tests, run in WordPress Playground
        # (PHP 8.3 + WordPress 7.1, and PHP 7.4 + WordPress 6.6).
        run: pnpm test

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Package the WordPress plugin
        run: pnpm --filter @chronicle/wordpress package

      - name: Upload the WordPress plugin
        uses: actions/upload-artifact@v4
        with:
          name: chronicle-timeline-plugin
          path: packages/wordpress/dist/*.zip
          retention-days: 30

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        # One browser install serves both suites (same Playwright version).
        run: pnpm --filter @chronicle/editor exec playwright install --with-deps chromium

      - name: Cache WordPress downloads (Playground)
        uses: actions/cache@v4
        with:
          path: ~/.wordpress-playground
          key: wordpress-playground-${{ hashFiles('pnpm-lock.yaml') }}

      - name: E2E + accessibility tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            packages/web-component/playwright-report
            packages/web-component/test-results
            packages/editor/test-results
            packages/wordpress/test-results
          retention-days: 7
